[project]
name = "stock-mcp"
version = "0.1.0"
description = "MCP server exposing stock market data and technical analysis tools (Yahoo Finance, Alpha Vantage, Stooq, kabu.com)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas-datareader>=0.10",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "mplfinance>=0.12.10b0",
    "aiosqlite>=0.20",
]

[project.scripts]
stock-mcp = "stock_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_mcp"]
